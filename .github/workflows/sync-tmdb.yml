name: Sync TMDB Cache

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync TMDB
        run: node scripts/sync-tmdb.js
        env:
          TMDB_KEYS: ${{ secrets.TMDB_KEYS }}

      - name: Commit and Push
        run: |
          git config user.name "cache-bot"
          git config user.email "cache-bot@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-sync $(date -u +%Y-%m-%d-%H)"
          git pull --rebase origin main || true
          git push
