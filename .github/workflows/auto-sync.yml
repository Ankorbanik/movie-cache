name: Auto Cache Sync (Ultimate Engine v9.0)

on:
  schedule:
    - cron: '0 */2 * * *' # প্রতি ২ ঘণ্টায় রান হবে
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

permissions:
  contents: write

# যদি আগের কোনো সিঙ্ক চলতে থাকে, তবে সেটি বাতিল করে নতুনটি শুরু হবে
concurrency:
  group: cache-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Timeout বাড়িয়ে ৬০ মিনিট করা হলো (v9.0 এর হেভি ডাটার জন্য)
    
    env:
      NODE_OPTIONS: "--max-old-space-size=4096" # বড় JSON ফাইল প্রসেস করার জন্য ৪ জিবি মেমরি

    steps:
      - name: 📥 Checkout Main Repository
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Cache Node Modules
        uses: actions/cache@v3
        with:
          path: src/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('src/package-lock.json', 'src/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📦 Install Dependencies
        working-directory: src
        run: npm install

      - name: 🔄 Load Previous Cache (from cache-data branch)
        run: |
          mkdir -p prev-cache
          cd prev-cache
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch --depth=1 origin cache-data 2>/dev/null; then
            git checkout -q FETCH_HEAD
            mkdir -p ../src/cache
            cp -r cache/* ../src/cache/ 2>/dev/null || true
            echo "✅ Previous cache loaded successfully!"
            du -sh ../src/cache || true
          else
            echo "ℹ️ First run — no previous cache found."
          fi

      - name: 🧹 Manage Cache Size (95 MB Limit)
        working-directory: src
        run: node scripts/manage-size.js

      - name: 🚀 Sync Fresh Data (10 Databases)
        working-directory: src
        env:
          TMDB_KEYS: ${{ secrets.TMDB_KEYS }}
          OMDB_KEYS: ${{ secrets.OMDB_KEYS }}
          WATCHMODE_KEYS: ${{ secrets.WATCHMODE_KEYS }}
          FANART_KEYS: ${{ secrets.FANART_KEYS }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: node scripts/sync-all.js

      - name: 📦 Prepare Clean Deploy Repository
        run: |
          mkdir -p deploy
          cd deploy
          git init -q
          git config user.name "cache-bot"
          git config user.email "cache-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          mkdir -p cache
          cp -r ../src/cache/* cache/ 2>/dev/null || true
          echo "📊 Final cache size to deploy:"
          du -sh cache/

      - name: 🚀 Force-Push to cache-data branch
        working-directory: deploy
        run: |
          git add -A
          # চেক করা হচ্ছে কোনো পরিবর্তন আছে কিনা
          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ️ No changes detected in cache. Skipping commit."
          else
            git commit -m "chore: auto-sync cache [$(date -u +%Y-%m-%d-%H)]" --quiet
            git branch -M cache-data
            git push -f origin cache-data
            echo "✅ Successfully pushed to cache-data branch!"
          fi

      - name: 📦 Backup Cache as Artifact (Safety)
        uses: actions/upload-artifact@v4
        with:
          name: cache-backup-${{ github.run_number }}
          path: deploy/cache/
          retention-days: 3

      - name: 🔔 Notify Cloudflare Worker
        if: success() # সিঙ্ক সফল হলেই কেবল নোটিফাই করবে
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_WORKER_URL }}" ]; then
            curl -X POST "${{ secrets.CLOUDFLARE_WORKER_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.WORKER_SECRET }}" \
            -d '{"event": "sync_complete", "status": "success", "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'
            echo "✅ Cloudflare Worker notified successfully."
          else
            echo "⚠️ No Cloudflare Worker URL found, skipping notification."
          fi
